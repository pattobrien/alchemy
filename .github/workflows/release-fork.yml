name: Release (fork)

on:
  push:
    branches:
      - main
    tags:
      - "v*-fork.*"
  workflow_dispatch:

concurrency:
  group: release-fork-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout distilled
        run: git submodule update --init --depth=1 --checkout -- submodules/distilled

      - name: Setup pnpm, Node.js, Bun and install dependencies
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          cache: true
          install: true
          require-lockfile: true

      - name: Resolve the fork version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node scripts/release/fork-next-version.ts)"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing $VERSION"

      - name: Build release packages
        env:
          GOMEMLIMIT: 6GiB
          GOGC: "40"
        run: pnpm build:pkg

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '@pattobrien:registry=https://npm.pkg.github.com' >> .npmrc
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"

      - name: Tag the release
        if: github.ref_type == 'branch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "v$VERSION"

      - name: Publish to GitHub Packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release/fork-publish.ts "$VERSION"
